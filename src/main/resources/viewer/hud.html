<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duke HUD</title>
<style>
  :root { --background: #2b2d30; --foreground: #dfe1e5; --muted: #868a91; --border: #43454a; --accent: #3574f0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background); color: var(--foreground);
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #view { position: absolute; inset: 0 0 22px 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; left: 8px; right: 8px; bottom: 3px; color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
</style>
<script>
  // What the IDE asks before the page's script has loaded waits for it.
  window.duke = { waiting: [], showHud(scene, colours) { this.waiting.push(['showHud', scene, colours]); } };
</script>
<script type="module" src="./hud.js"></script>
</head>
<body>
<div id="view"><canvas id="bar"></canvas></div>
<div id="status"></div>
</body>
</html>
