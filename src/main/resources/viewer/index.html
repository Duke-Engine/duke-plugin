<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duke preview</title>
<style>
  :root { --background: #2b2d30; --foreground: #dfe1e5; --muted: #868a91; --border: #43454a; --accent: #3574f0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background); color: var(--foreground);
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
  #actions { top: 8px; }
  #sounds { bottom: 8px; }
  button { pointer-events: auto; font: inherit; color: var(--foreground); background: var(--background);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; cursor: pointer; opacity: 0.92; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button.missing { color: var(--muted); text-decoration: line-through; }
  #status { position: absolute; right: 8px; top: 8px; max-width: 45%; color: var(--muted); text-align: right; }
  body.sounds-only #view, body.sounds-only #actions { display: none; }
  body.sounds-only #sounds { top: 8px; bottom: auto; }
</style>
<script type="importmap">
  { "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }
</script>
<script>
  // What the IDE asks before the viewer's module has loaded waits for it.
  window.duke = { waiting: [], show(scene, colours) { this.waiting.push(['show', scene, colours]); }, play(clip) { this.waiting.push(['play', clip]); } };
</script>
<script type="module" src="./viewer.js"></script>
</head>
<body>
<div id="view"></div>
<div id="actions" class="bar"></div>
<div id="sounds" class="bar"></div>
<div id="status"></div>
</body>
</html>
